<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Register - StreetConnect</title>
  <link rel="stylesheet" href="../styles/auth.css" />
  <style>
    body {
      font-family: Arial, sans-serif;
      background: #fff7f0;
      display: flex;
      justify-content: center;
      align-items: center;
      height: 100vh;
      margin: 0;
    }
    .form-container {
      background: white;
      padding: 30px;
      border-radius: 10px;
      box-shadow: 0 4px 10px rgba(0,0,0,0.2);
      text-align: center;
      width: 320px;
    }
    .form-container h2 {
      color: #ff7f50;
    }
    .form-container input {
      display: block;
      width: 90%;
      margin: 10px auto;
      padding: 10px;
      border: 1px solid #ccc;
      border-radius: 5px;
    }
    .form-container button {
      width: 95%;
      padding: 10px;
      background: #ff7f50;
      color: white;
      border: none;
      border-radius: 5px;
      cursor: pointer;
    }
    .form-container button:hover {
      background: #e5673a;
    }
    .form-container p {
      margin-top: 10px;
    }
    .form-container a {
      color: #ff7f50;
      text-decoration: none;
    }
  </style>
</head>
<body>
  <div class="form-container">
    <h2>Create Account</h2>
    <form id="registerForm">
      <input type="text" id="username" placeholder="Username" required />
      <input type="email" id="email" placeholder="Email" required />
      <input type="password" id="password" placeholder="Password" required />
      <button type="submit">Register</button>
    </form>
    <p>Already have an account? <a href="login.html">Login</a></p>
  </div>

  <!-- ✅ Firebase Script -->
  <script type="module">
    import { initializeApp } from "https://www.gstatic.com/firebasejs/12.0.0/firebase-app.js";
    import { getAnalytics } from "https://www.gstatic.com/firebasejs/12.0.0/firebase-analytics.js";
    import { getAuth, createUserWithEmailAndPassword, updateProfile } 
            from "https://www.gstatic.com/firebasejs/12.0.0/firebase-auth.js";

    const firebaseConfig = {
      apiKey: "AIzaSyCNJfUIj7PSRtry1VNEJCngtnYe927cPI4",
      authDomain: "streetconnect-e0522.firebaseapp.com",
      projectId: "streetconnect-e0522",
      storageBucket: "streetconnect-e0522.firebasestorage.app",
      messagingSenderId: "555804695389",
      appId: "1:555804695389:web:245a4bce9a6d9fe28766b4",
      measurementId: "G-KVGCP4S5TZ"
    };

    const app = initializeApp(firebaseConfig);
    const analytics = getAnalytics(app);
    const auth = getAuth(app);

    document.getElementById("registerForm").addEventListener("submit", function (e) {
      e.preventDefault();
      const username = document.getElementById("username").value;
      const email = document.getElementById("email").value;
      const password = document.getElementById("password").value;

      createUserWithEmailAndPassword(auth, email, password)
        .then((userCredential) => {
          // Save username in Firebase Auth profile
          updateProfile(userCredential.user, { displayName: username });
          alert("✅ Account Created Successfully!");
          window.location.href = "login.html";
        })
        .catch(err => alert("❌ " + err.message));
    });
  </script>
</body>
</html>
